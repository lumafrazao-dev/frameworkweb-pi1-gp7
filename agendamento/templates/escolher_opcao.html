<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaslu Funilaria — Escolher Opção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F5F3EE; --surface: #FFFFFF; --surface2: #EFECE6;
      --border: rgba(0,0,0,0.15); --border-strong: rgba(0,0,0,0.25);
      --ink: #11100E; --ink2: #4A4741;
      --radius: 14px; --radius-sm: 10px;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .page { max-width: 520px; width: 100%; }
    .header { text-align: center; margin-bottom: 2rem; animation: fadeUp 0.5s ease both; }
    .header-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--ink); color: #fff; font-size: 14px; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase; padding: 8px 16px;
      border-radius: 40px; margin-bottom: 1rem;
    }
    .header h1 {
      font-family: 'DM Serif Display', serif; font-size: 36px; font-weight: 400;
      letter-spacing: -0.5px; line-height: 1.2; color: var(--ink);
    }
    .header p { font-size: 18px; font-weight: 500; color: var(--ink2); margin-top: 10px; }

    .card {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 2rem 1.5rem; margin-bottom: 1rem;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      text-align: center;
    }

    /* Grid para alinhar os 3 botões redondos de forma simétrica */
    .botoes-grid {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      align-items: center;
      margin-top: 1rem;
    }

    .item-botao {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    /* Padrão Circular Gigante para TODOS os botões */
    .btn-redondo-gigante {
      width: 90px;
      height: 90px;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .btn-redondo-gigante svg {
      width: 42px;
      height: 42px;
    }
    .btn-redondo-gigante:hover {
      transform: scale(1.06);
      box-shadow: 0 8px 22px rgba(0,0,0,0.2);
    }
    .btn-redondo-gigante:active {
      transform: scale(0.96);
    }

    /* Cores e efeitos específicos de cada botão */
    .btn-audio {
      background: #2D6A4F;
      animation: pulseGlow 2s infinite;
    }
    .btn-audio:hover { background: #1B4332; }

    .btn-novo {
      background: var(--ink);
    }
    .btn-novo:hover { background: #2A2620; }

    .btn-editar {
      background: #0066cc;
    }
    .btn-editar:hover { background: #004d99; }

    /* Legenda centralizada abaixo de cada ícone */
    .legenda-botao {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .separador {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 1.2rem 0;
    }

    /* Pop-up Modal Amigável */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(17, 16, 14, 0.7);
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
      z-index: 9999;
    }
    .modal-card {
      background: var(--surface); width: 100%; max-width: 440px;
      border-radius: var(--radius); padding: 2.5rem 1.8rem; border: 2px solid var(--border-strong);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center;
    }
    .modal-card h3 {
      font-family: 'DM Serif Display', serif; font-size: 28px; font-weight: 400;
      margin-bottom: 12px; color: var(--ink);
    }
    .modal-card p { font-size: 17px; font-weight: 500; color: var(--ink2); line-height: 1.5; margin-bottom: 2rem; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    .btn-sim { background: #0066cc; color: white; border: none; padding: 16px; border-radius: var(--radius-sm); font-size: 17px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(0,102,204,0.3); }
    .btn-nao { background: var(--ink); color: white; border: none; padding: 16px; border-radius: var(--radius-sm); font-size: 17px; font-weight: 700; cursor: pointer; }
    
    .hidden { display: none !important; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(45, 106, 79, 0.5); }
      70% { box-shadow: 0 0 0 16px rgba(45, 106, 79, 0); }
      100% { box-shadow: 0 0 0 0 rgba(45, 106, 79, 0); }
    }
  </style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="header-badge">Oficina Gaslu</div>
    <h1>Agendamento Fácil</h1>
    <p>Escolha o que você deseja fazer abaixo</p>
  </header>

  <div class="card">
    <div class="botoes-grid">
      <!-- 1. Botão de Áudio -->
      <div class="item-botao">
        <button type="button" class="btn-redondo-gigante btn-audio" id="btnOuvirOrientacao" title="Ouvir orientações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <span class="legenda-botao" style="color: #2D6A4F;">Toque para ouvir as instruções</span>
      </div>

      <div class="separador"></div>

      <!-- 2. Botão Novo Agendamento -->
      <div class="item-botao">
        <a href="{% url 'home' %}" class="btn-redondo-gigante btn-novo" title="Novo agendamento">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </a>
        <span class="legenda-botao">Novo agendamento</span>
      </div>

      <!-- 3. Botão Editar Agendamento -->
      <div class="item-botao">
        <a href="{% url 'buscar_cadastro' %}" class="btn-redondo-gigante btn-editar" title="Editar agendamento ou cadastro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </a>
        <span class="legenda-botao">Editar Agendamento ou Cadastro</span>
      </div>
    </div>
  </div>
</div>

<div id="modalAudioIntro" class="modal-backdrop hidden">
  <div class="modal-card">
    <h3>Ajuda por Voz</h3>
    <p>Deseja continuar ouvindo as instruções faladas para preencher o sistema?</p>
    <div class="modal-actions">
      <button type="button" class="btn-sim" id="btnSimAudio">Sim, continuar</button>
      <button type="button" class="btn-nao" id="btnNaoAudio">Desativar áudio</button>
    </div>
  </div>
</div>

<script>
  function falar(texto, callbackOnEnd) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const mensagem = new SpeechSynthesisUtterance(texto);
      mensagem.lang = "pt-BR";
      mensagem.rate = 1.0;
      if (callbackOnEnd) mensagem.onend = callbackOnEnd;
      window.speechSynthesis.speak(mensagem);
    }
  }

  document.addEventListener("DOMContentLoaded", function() {
    localStorage.removeItem("audioFoiPerguntado");
    const modal = document.getElementById("modalAudioIntro");
    const btnOuvir = document.getElementById("btnOuvirOrientacao");

    btnOuvir.addEventListener("click", function() {
      const textoIntro = "Bem vindo ao sistema de agendamento da Oficina Gaslu Funilaria e Pintura. Deseja continuar com o áudio de ajuda? Clique no botão azul para continuar e no botão preto para desativar. Logo em seguida, nos botões abaixo, você terá as opções de realizar um novo agendamento ou editar agendamento.";
      falar(textoIntro, function() {
        if (modal) modal.classList.remove("hidden");
      });
    });

    document.getElementById("btnSimAudio").addEventListener("click", function() {
      localStorage.setItem("audioAjudaAtivo", "sim");
      modal.classList.add("hidden");
      falar("O áudio continuará ativo.");
    });

    document.getElementById("btnNaoAudio").addEventListener("click", function() {
      localStorage.setItem("audioAjudaAtivo", "nao");
      modal.classList.add("hidden");
      falar("O áudio foi desativado."
      window.speechSynthesis.cancel();
    });
  });
</script>
</body>
</html>
