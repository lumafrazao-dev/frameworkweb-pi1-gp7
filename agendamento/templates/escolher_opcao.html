<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaslu Funilaria — Escolher Opção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F5F3EE; --surface: #FFFFFF; --surface2: #F0EDE7;
      --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
      --ink: #1A1814; --ink2: #6B6760; --ink3: #9E9B97;
      --radius: 12px; --radius-sm: 8px;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .page { max-width: 480px; width: 100%; }
    .header { text-align: center; margin-bottom: 2.5rem; animation: fadeUp 0.5s ease both; }
    .header-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--ink); color: #fff; font-size: 12px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 14px;
      border-radius: 40px; margin-bottom: 1rem;
    }
    .header-badge svg { width: 14px; height: 14px; }
    .header h1 {
      font-family: 'DM Serif Display', serif; font-size: 32px; font-weight: 400;
      letter-spacing: -0.5px; line-height: 1.15;
    }
    .header p { font-size: 15px; color: var(--ink2); margin-top: 8px; }
    
    .btn-audio-icone {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; background: var(--surface2);
      border: 0.5px solid var(--border-strong); color: var(--ink);
      border-radius: 50%; cursor: pointer; margin-top: 15px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-audio-icone:hover { background: var(--border); transform: scale(1.05); }

    .card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem;
      animation: fadeUp 0.5s ease both;
    }
    .btn-primary, .btn-secondary {
      width: 100%; padding: 14px; border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
      cursor: pointer; text-align: center; text-decoration: none; display: block;
      transition: opacity 0.15s, transform 0.1s, background 0.15s;
    }
    .btn-primary { background: var(--ink); color: #fff; border: none; margin-bottom: 10px; }
    .btn-primary:hover { opacity: 0.82; }
    .btn-secondary { background: var(--surface2); color: var(--ink); border: 0.5px solid var(--border-strong); }
    .btn-secondary:hover { background: var(--border); }

    /* Pop-up Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(26, 24, 20, 0.6);
      display: flex; align-items: center; justify-content: center; padding: 1rem;
      z-index: 9999; animation: fadeUp 0.2s ease both;
    }
    .modal-card {
      background: var(--surface); width: 100%; max-width: 400px;
      border-radius: var(--radius); padding: 2rem 1.5rem; border: 0.5px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15); text-align: center;
    }
    .modal-card h3 {
      font-family: 'DM Serif Display', serif; font-size: 22px; font-weight: 400;
      margin-bottom: 10px; color: var(--ink);
    }
    .modal-card p { font-size: 14px; color: var(--ink2); line-height: 1.5; margin-bottom: 1.5rem; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-sim { background: #007bff; color: white; border: none; padding: 12px; border-radius: var(--radius-sm); font-weight: 500; cursor: pointer; }
    .btn-nao { background: #1A1814; color: white; border: none; padding: 12px; border-radius: var(--radius-sm); font-weight: 500; cursor: pointer; }
    .hidden { display: none !important; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="header-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 17h1v1a1 1 0 0 0 2 0v-1h12v1a1 1 0 0 0 2 0v-1h1v-4l-2-6H5l-2 6v4z"/>
        <circle cx="7.5" cy="17" r="1.5" fill="currentColor" stroke="none"/>
        <circle cx="16.5" cy="17" r="1.5" fill="currentColor" stroke="none"/>
      </svg>
      Funilaria & Pintura
    </div>
    <h1>Gaslu Funilaria</h1>
    <p>Selecione o que você deseja fazer</p>

    <!-- Símbolo de ouvido para reativar o áudio manualmente -->
    <button type="button" class="btn-audio-icone" id="btnReativarAudio" title="Ativar áudio de ajuda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
        <path d="M6 9H2v6h4l5 5V4L6 9z"></path>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
    </button>
  </header>

  <div class="card">
    <a href="{% url 'home' %}" class="btn-primary">📅 Novo Agendamento</a>
    <a href="{% url 'buscar_cadastro' %}" class="btn-secondary">✏️ Editar Agendamento / Cadastro</a>
  </div>
</div>

<!-- Pop-up automático de voz -->
<div id="modalAudioIntro" class="modal-backdrop hidden">
  <div class="modal-card">
    <h3>Assistente de Voz</h3>
    <p>Deseja continuar com o recurso de ajuda por áudio?</p>
    <div class="modal-actions">
      <button type="button" class="btn-sim" id="btnSimAudio">Sim, continuar</button>
      <button type="button" class="btn-nao" id="btnNaoAudio">Desativar áudio</button>
    </div>
  </div>
</div>

<script>
  function falar(texto, callback) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.0;
      if (callback) utterance.onend = callback;
      window.speechSynthesis.speak(utterance);
    }
  }

  document.addEventListener("DOMContentLoaded", function() {
    // Verifica se já foi perguntado nesta sessão
    const audioFoiPerguntado = localStorage.getItem("audioFoiPerguntado");

    if (!audioFoiPerguntado) {
      // Como navegadores bloqueiam áudio automático sem interação,
      // disparamos o áudio e o pop-up no PRIMEIRO CLIQUE ou toque na tela.
      const dispararExperienciaVoz = function() {
        localStorage.setItem("audioFoiPerguntado", "true");
        
        // Remove os ouvintes para disparar apenas uma vez
        document.removeEventListener("click", dispararExperienciaVoz);
        document.removeEventListener("touchstart", dispararExperienciaVoz);

        const textoIntro = "Bem vindo ao sistema de agendamento da Oficina Gaslu Funilaria e Pintura, deseja continua com o áudio de ajuda, clique no botão azul para sim e no botão preto para não?";

        falar(textoIntro, function() {
          document.getElementById("modalAudioIntro").classList.remove("hidden");
        });
      };

      document.addEventListener("click", dispararExperienciaVoz);
      document.addEventListener("touchstart", dispararExperienciaVoz);
    }

    // Botão Sim do Pop-up
    document.getElementById("btnSimAudio").addEventListener("click", function(e) {
      e.stopPropagation(); // Evita conflitos de clique
      localStorage.setItem("audioAjudaAtivo", "sim");
      document.getElementById("modalAudioIntro").classList.add("hidden");
      falar("Áudio de ajuda ativado.");
    });

    // Botão Não do Pop-up
    document.getElementById("btnNaoAudio").addEventListener("click", function(e) {
      e.stopPropagation();
      localStorage.setItem("audioAjudaAtivo", "nao");
      document.getElementById("modalAudioIntro").classList.add("hidden");
      window.speechSynthesis.cancel();
    });

    // Reativar manualmente pelo símbolo do ouvido
    document.getElementById("btnReativarAudio").addEventListener("click", function(e) {
      e.stopPropagation();
      localStorage.setItem("audioAjudaAtivo", "sim");
      localStorage.setItem("audioFoiPerguntado", "true");
      document.getElementById("modalAudioIntro").classList.add("hidden");
      falar("Áudio de ajuda reativado com sucesso.");
    });
  });
</script>
</body>
</html>
