<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaslu Funilaria — Buscar Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F5F3EE; --surface: #FFFFFF; --surface2: #F0EDE7;
      --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
      --ink: #1A1814; --ink2: #6B6760; --ink3: #9E9B97;
      --radius: 12px; --radius-sm: 8px;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page { max-width: 480px; width: 100%; }
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 {
      font-family: 'DM Serif Display', serif; font-size: 28px; font-weight: 400;
      letter-spacing: -0.5px; margin-bottom: 6px;
    }
    .header p { font-size: 14px; color: var(--ink2); }

    .card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem;
    }
    .field { margin-bottom: 1.25rem; }
    .field label {
      display: flex; align-items: center; gap: 6px; font-size: 13px;
      font-weight: 500; color: var(--ink2); margin-bottom: 6px;
    }
    .field input {
      width: 100%; padding: 11px 13px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--surface2); color: var(--ink); outline: none;
    }
    .field input:focus { background: var(--surface); border-color: var(--ink); }
    
    .btn-primary {
      width: 100%; padding: 13px; background: var(--ink); color: #fff;
      border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.82; }
    .btn-secondary {
      width: 100%; padding: 12px; background: transparent; color: var(--ink);
      border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      cursor: pointer; text-align: center; text-decoration: none; display: block; margin-top: 8px;
    }
    .btn-secondary:hover { background: var(--surface2); }

    /* Modal / Pop-up customizado com o design do site */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(26, 24, 20, 0.5);
      display: flex; align-items: center; justify-content: center; padding: 1rem;
      z-index: 999; animation: fadeUp 0.2s ease both;
    }
    .modal-card {
      background: var(--surface); width: 100%; max-width: 400px;
      border-radius: var(--radius); padding: 1.5rem; border: 0.5px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15); text-align: center;
    }
    .modal-card h3 {
      font-family: 'DM Serif Display', serif; font-size: 22px; font-weight: 400;
      margin-bottom: 10px; color: var(--ink);
    }
    .modal-card p { font-size: 14px; color: var(--ink2); line-height: 1.5; margin-bottom: 1.5rem; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>Editar Agendamento</h1>
    <p>Insira seus dados para localizar o registro</p>
  </div>

  <div class="card">
    <form method="POST">
      {% csrf_token %}
      <div class="field">
        <label>Nome completo cadastrado</label>
        <input type="text" name="nome_busca" placeholder="Ex: João Silva" required>
      </div>
      <button type="submit" class="btn-primary">Buscar Informações</button>
      <a href="{% url 'escolher_opcao' %}" class="btn-secondary">Voltar ao início</a>
    </form>
  </div>
</div>

<!-- Pop-up de Erro (Exibido se o Django retornar erro = True) -->
{% if erro %}
<div class="modal-backdrop">
  <div class="modal-card">
    <h3>Atenção</h3>
    <p>Dados inválidos ou inexistentes. Verifique as informações e tente novamente ou crie um novo cadastro.</p>
    <div class="modal-actions">
      <a href="{% url 'buscar_cadastro' %}" class="btn-secondary" style="margin-top:0;">Voltar</a>
      <a href="{% url 'home' %}" class="btn-primary" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">Criar novo</a>
    </div>
  </div>
</div>
{% endif %}

</body>
</html>
