<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Buscar Cadastro</title>
    <!-- Se usar Bootstrap, inclua os links do CSS e JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2>Editar Agendamento</h2>
                <p>Digite seu nome completo:</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" name="nome_busca" class="form-control" placeholder="Ex: João da Silva" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Buscar Informações</button>
                    <a href="{% url 'escolher_opcao' %}" class="btn btn-link w-100 mt-2">Voltar ao início</a>
                </form>
            </div>
        </div>
    </div>

    <!-- Pop-up de Erro (Modal do Bootstrap) caso o cadastro não seja encontrado -->
    {% if erro %}
    <div class="modal fade show" id="erroModal" tabindex="-1" style="display: block; background: rgba(0,0,0,0.5);">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Atenção</h5>
                </div>
                <div class="modal-body">
                    <p>Dados inválidos ou inexistentes. Verifique as informações e tente novamente ou crie um novo cadastro.</p>
                </div>
                <div class="modal-footer">
                    <a href="{% url 'escolher_opcao' %}" class="btn btn-secondary">Voltar</a>
                    <a href="{% url 'home' %}" class="btn btn-success">Criar Novo Cadastro</a>
                </div>
            </div>
        </div>
    </div>
    {% endif %}

</body>
</html>
