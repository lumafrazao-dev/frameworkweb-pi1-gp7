<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaslu Funilaria — Agendar Orçamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F5F3EE; --surface: #FFFFFF; --surface2: #F0EDE7;
      --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
      --ink: #1A1814; --ink2: #6B6760; --ink3: #9E9B97;
      --green: #2D6A4F; --green-bg: #D8F3DC;
      --radius: 12px; --radius-sm: 8px;
    }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink);
      min-height: 100vh; padding: 2rem 1rem 4rem;
    }
    .page { max-width: 500px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 2.5rem; }
    .header-badge {
      display: inline-flex; align-items: center; gap: 8px; background: var(--ink);
      color: #fff; font-size: 12px; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 6px 14px; border-radius: 40px; margin-bottom: 1rem;
    }
    .header h1 { font-family: 'DM Serif Display', serif; font-size: 32px; font-weight: 400; }
    .header p { font-size: 15px; color: var(--ink2); margin-top: 8px; }

    .btn-audio-icone {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; background: var(--surface2); border: 0.5px solid var(--border-strong);
      color: var(--ink); border-radius: 50%; cursor: pointer; margin-top: 12px; transition: transform 0.1s;
    }
    .btn-audio-icone:hover { transform: scale(1.05); }

    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; }
    .step-num { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .card-header span { font-size: 13px; font-weight: 500; color: var(--ink2); text-transform: uppercase; }

    .field { margin-bottom: 1rem; }
    .field label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink2); margin-bottom: 6px; }
    .field input { width: 100%; padding: 11px 13px; font-size: 15px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface2); outline: none; }
    .field input:focus { background: var(--surface); border-color: var(--ink); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn-primary { width: 100%; padding: 13px; background: var(--ink); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 1.25rem; }
    .btn-primary:hover { opacity: 0.82; }
    .btn-secondary { width: 100%; padding: 12px; background: var(--surface2); color: var(--ink); border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; text-align: center; text-decoration: none; display: block; margin-top: 8px; }
    .btn-secondary:hover { background: var(--border); }

    .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .slot { padding: 11px 4px; text-align: center; font-size: 14px; font-weight: 500; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); cursor: pointer; background: #fff; }
    .slot.selected { background: var(--ink); color: #fff; }
    .confirm-box { margin-top: 1.25rem; padding: 1rem; background: var(--surface2); border-radius: var(--radius-sm); }
    .confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-ghost { padding: 10px; background: transparent; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); cursor: pointer; }
    .btn-confirm { padding: 10px; background: var(--ink); color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="header-badge">Funilaria & Pintura</div>
    <h1>Gaslu Funilaria</h1>
    <p>Agende seu orçamento de forma rápida e prática</p>
    
    <button type="button" class="btn-audio-icone" id="btnReativarVoz" title="Ouvir orientações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
        <path d="M6 9H2v6h4l5 5V4L6 9z"></path>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
    </button>
  </header>

  <form method="POST" id="formAgendamento">
    {% csrf_token %}
    <div class="card">
      <div class="card-header">
        <div class="step-num">1</div>
        <span>Seus dados</span>
      </div>

      <div class="field">
        <label>Nome completo</label>
        <input type="text" name="nome" id="nome" placeholder="Ex: João Silva" value="{{ dados.nome|default:'' }}" required>
      </div>

      <div class="row">
        <div class="field">
          <label>Telefone</label>
          <input type="text" name="telefone" id="telefone" placeholder="(13) 99999-0000" value="{{ dados.telefone|default:'' }}" maxlength="15" required>
        </div>
        <div class="field">
          <label>Placa</label>
          <input type="text" name="placa" id="placa" placeholder="ABC1234" value="{{ dados.placa|default:'' }}" maxlength="7" required>
        </div>
      </div>

      <div class="field">
        <label>Data preferida</label>
        <input type="date" name="data" id="data" value="{{ dados.data|default:'' }}" required>
      </div>

      <input type="hidden" name="horario" id="horarioForm">
      <button type="button" class="btn-primary" onclick="buscarHorarios()">Ver horários disponíveis</button>
      
      <!-- Botão Voltar ao Início solicitado -->
      <a href="{% url 'escolher_opcao' %}" class="btn-secondary">Voltar ao início</a>
    </div>
  </form>

  <div id="secaoHorarios" {% if not horarios %}class="hidden"{% endif %}>
    <div class="card">
      <div class="card-header">
        <div class="step-num">2</div>
        <span>Horário disponível</span>
      </div>
      <p class="date-label" id="dataLabel"></p>
      <div class="slots-grid" id="slotsGrid">
        {% if horarios %}
          {% for h in horarios %}
            <button type="button" class="slot horario-btn" data-horario="{{ h }}">{{ h }}</button>
          {% endfor %}
        {% endif %}
      </div>
      <div class="confirm-box hidden" id="confirmBox">
        <p>Confirmar agendamento para <strong id="horarioLabel"></strong>?</p>
        <div class="confirm-actions">
          <button type="button" class="btn-ghost" onclick="voltar()">Cancelar</button>
          <button type="button" class="btn-confirm" onclick="confirmar()">Confirmar e enviar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function falarTexto(texto) {
    if (localStorage.getItem("audioAjudaAtivo") === "nao") return;
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  }

  // Controle anti-loop para os campos
  let ultimoCampoFalado = "";

  document.querySelectorAll("#formAgendamento input").forEach(input => {
    input.addEventListener("focus", async function() {
      if (localStorage.getItem("audioAjudaAtivo") === "nao") return;
      
      const nomeCampo = this.name;
      if (ultimoCampoFalado === nomeCampo) return;
      ultimoCampoFalado = nomeCampo;

      try {
        const response = await fetch(`/api/guia-cadastro/?campo=${nomeCampo}`);
        const resultado = await response.json();
        if (resultado.status === "sucesso" && resultado.dados_campo) {
          const info = resultado.dados_campo;
          falarTexto(`${info.titulo}. ${info.explicacao}`);
        }
      } catch (erro) {
        if (nomeCampo === 'nome') falarTexto("Preencha seu nome completo.");
        if (nomeCampo === 'telefone') falarTexto("Preencha seu telefone com DDD.");
        if (nomeCampo === 'placa') falarTexto("Preencha a placa do veículo.");
        if (nomeCampo === 'data') falarTexto("Escolha a data preferida.");
      }
    });
  });

  // Botão de ouvido (Interruptor Inteligente: Liga e Desliga)
  const btnVoz = document.getElementById("btnReativarVoz");
  if (btnVoz) {
    btnVoz.addEventListener("click", function() {
      const estadoAtual = localStorage.getItem("audioAjudaAtivo");
      
      if (estadoAtual === "sim") {
        localStorage.setItem("audioAjudaAtivo", "nao");
        window.speechSynthesis.cancel();
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance("Áudio de ajuda desativado.");
          utterance.lang = 'pt-BR';
          window.speechSynthesis.speak(utterance);
        }
        alert("Áudio de ajuda desativado.");
      } else {
        localStorage.setItem("audioAjudaAtivo", "sim");
        falarTexto("Áudio de ajuda reativado com sucesso.");
        alert("Áudio de ajuda ativado.");
      }
    });
  }

  // Máscaras automáticas
  document.getElementById("telefone").addEventListener("input", function(e) {
    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
    if (v.length > 6) v = v.replace(/(\d{2})(\d{5})(\d+)/, "($1) $2-$3");
    else if (v.length > 2) v = v.replace(/(\d{2})(\d+)/, "($1) $2");
    e.target.value = v;
  });

  document.getElementById("placa").addEventListener("input", function(e) {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  });

  function buscarHorarios() {
    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const placa = document.getElementById("placa").value.trim();
    const data = document.getElementById("data").value;

    if (!nome || !telefone || !placa || !data) {
      alert("Preencha todos os campos antes de buscar os horários.");
      return;
    }
    document.getElementById("horarioForm").value = "";
    document.getElementById("formAgendamento").submit();
  }

  // Torna os botões de horário clicáveis após a busca
  function initSlots() {
    const botoes = document.querySelectorAll(".horario-btn");
    botoes.forEach(btn => {
      btn.onclick = function() {
        botoes.forEach(b => b.classList.remove("selected"));
        this.classList.add("selected");
        
        const horarioEscolhido = this.dataset.horario;
        document.getElementById("horarioForm").value = horarioEscolhido;
        document.getElementById("horarioLabel").textContent = horarioEscolhido;
        document.getElementById("confirmBox").classList.remove("hidden");
        
        falarTexto(`Horário ${horarioEscolhido} selecionado. Clique em confirmar.`);
      };
    });

    const dataInput = document.getElementById("data").value;
    if (dataInput) {
      const [y, m, d] = dataInput.split("-");
      const dateObj = new Date(+y, +m - 1, +d);
      const opts = { weekday: "long", day: "2-digit", month: "long", year: "numeric" };
      const labelEl = document.getElementById("dataLabel");
      if (labelEl) {
        labelEl.innerHTML = "<strong>" + dateObj.toLocaleDateString("pt-BR", opts) + "</strong>";
      }
    }
  }

  // Executa assim que a página carrega caso já existam horários na tela
  document.addEventListener("DOMContentLoaded", function() {
    if (document.querySelectorAll(".horario-btn").length > 0) {
      const secao = document.getElementById("secaoHorarios");
      if (secao) secao.classList.remove("hidden");
      initSlots();
    }
  });
  // Função para cancelar a seleção do horário e esconder a caixinha de confirmação
  function voltar() {
    document.getElementById("confirmBox").classList.add("hidden");
    document.getElementById("horarioForm").value = "";
    document.querySelectorAll(".horario-btn").forEach(b => b.classList.remove("selected"));
    falarTexto("Seleção de horário cancelada. Escolha outro horário se desejar.");
  }

  // Função para confirmar o agendamento e enviar os dados para o Django
  function confirmar() {
    const horario = document.getElementById("horarioForm").value;
    if (!horario) {
      alert("Por favor, selecione um horário antes de confirmar.");
      return;
    }
    
    falarTexto(`Agendamento confirmado para as ${horario}. Enviando dados.`);
    
    // Se o botão faz parte do formulário principal, submetemos ele:
    const form = document.getElementById("formAgendamento");
    
    // Garantimos que o campo hidden com o horário está preenchido
    document.getElementById("horarioForm").value = horario;
    
    // Dispara o envio oficial do formulário para o Django salvar no SQLite
    form.submit();
  }
</script>
</body>
</html>
